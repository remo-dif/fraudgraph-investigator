plugins {
    id "java"
    id "org.springframework.boot" version "3.5.16"
    id "io.spring.dependency-management" version "1.1.7"
}

group = "com.fraudgraph"
version = "0.1.0"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation "org.apache.commons:commons-csv:1.14.1"
    implementation "org.springframework.boot:spring-boot-starter-security"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-data-neo4j"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:2.10.1"

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.mockito:mockito-junit-jupiter"
    testImplementation "org.testcontainers:neo4j"
}

tasks.named("test") {
    useJUnitPlatform()
    exclude "**/*IntegrationTest.class"
}

tasks.register("neo4jIntegrationTest", Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include "**/*IntegrationTest.class"
    filter { includeTestsMatching "*IntegrationTest" }
    afterSuite { suite, result ->
        if (suite.parent == null && (result.testCount == 0 || result.skippedTestCount != 0)) {
            throw new GradleException("Mandatory Neo4j tests missing or skipped")
        }
    }
}
