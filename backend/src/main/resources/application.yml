spring:
  profiles:
    default: demo
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: fraudgraph-investigator-api

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

fraudgraph:
  preview:
    token: ${FRAUDGRAPH_PREVIEW_TOKEN:}
