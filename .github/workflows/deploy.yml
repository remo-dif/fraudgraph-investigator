name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: Image tag to deploy
        required: true
        default: main

permissions:
  contents: read

jobs:
  deploy:
    name: Deployment placeholder
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Explain deployment contract
        run: |
          echo "Deploying FraudGraph Investigator to ${{ inputs.environment }}"
          repository="${GITHUB_REPOSITORY,,}"
          echo "Backend image: ghcr.io/${repository}/backend:${{ inputs.image_tag }}"
          echo "Frontend image: ghcr.io/${repository}/frontend:${{ inputs.image_tag }}"
          echo "Wire this job to the target platform once hosting is selected."
