name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run component tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

  backend:
    name: Backend test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run backend tests in Gradle container
        run: >
          docker run --rm
          -v "${{ github.workspace }}:/workspace"
          -w /workspace
          gradle:8.10.2-jdk21
          gradle :backend:test --no-daemon

  compose:
    name: Docker Compose build and smoke test
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Compose file
        run: docker compose config

      - name: Build Compose images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d neo4j backend frontend

      - name: Wait for API health
        shell: bash
        run: |
          for attempt in {1..36}; do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs backend
          exit 1

      - name: Smoke test API endpoints
        run: |
          curl -fsS http://localhost:8080/api/dashboard/summary
          curl -fsS http://localhost:8080/api/hypergraph/cases/case-seed-001

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down -v
